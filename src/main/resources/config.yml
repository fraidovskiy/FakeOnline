# FakeOnline - помощник для Fake Player Plugin (FPP).
# Сам создаёт ботов при старте сервера, запускает им хождение по спавну
# и даёт команду /bots <число> для ручной регулировки количества.

# Ники ботов. Берите ники реальных аккаунтов (скины подтянутся).
# Максимум ботов = количество ников в этом списке.
bots:
  - Kirill_Gamer
  - xX_Dimon_Xx
  - Nastya_Craft
  - Sanek2007
  - MrCreeper_
  - Lesha_PvP
  - Vika_Pixel
  - TimoXa
  - Artem_Build
  - NoobMaster_RU
  - Masha_Cat
  - Zhenya_Redstone
  - Vlad_Miner
  - Dasha_Star
  - Egor_Ender

# Сколько ботов запускать при старте, если /bots ещё не использовали.
count: 12

# Мир (пустое = основной мир). Центр = точка спавна мира.
world: ""

# Через сколько секунд после старта сервера создавать ботов
start-delay-seconds: 20

# Паузы между созданием/удалением ботов (секунды, случайно в этом диапазоне)
gap-min-seconds: 3
gap-max-seconds: 12

# Бот появляется в пределах стольких блоков от спавна
spawn-offset: 3

# Радиус хождения вокруг спавна (у каждого свой, случайно в этом диапазоне)
roam-radius-min: 12
roam-radius-max: 25

# Через сколько тиков после создания бота давать команду ходить (20 тиков = 1 сек)
roam-delay-ticks: 60

# При старте сначала убрать всех ботов FPP, потом создать по списку
despawn-all-on-start: true

# Убирать ботов при остановке сервера (обычно не нужно)
despawn-on-disable: false

# Писать в консоль, какие команды выполняет плагин
log-commands: true

# Шаблоны команд FPP. Подстановки: {name} {world} {x} {y} {z} {cx} {cy} {cz} {radius}
commands:
  spawn: "fpp spawn {world} {x} {y} {z} --name {name}"
  roam: "fpp move {name} --roam {cx},{cy},{cz} {radius}"
  despawn: "fpp despawn {name}"
  despawn-all: "fpp despawn all"
