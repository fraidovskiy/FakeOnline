# Ники ботов (минимум столько, сколько max-online). Скин подтянется по нику,
# поэтому лучше брать ники реально существующих аккаунтов.
bots:
  - Kirill_Gamer
  - xX_Dimon_Xx
  - Nastya_Craft
  - Sanek2007
  - MrCreeper_
  - Lesha_PvP
  - Vika_Pixel
  - TimoXa
  - Artem_Build
  - NoobMaster_RU
  - Masha_Cat
  - Zhenya_Redstone
  - Vlad_Miner
  - Dasha_Star
  - Egor_Ender

# Сколько ботов на сервере (случайно между min и max, выбирается при старте)
min-online: 10
max-online: 15

# Мир и радиус беготни. Пустой world = мир по умолчанию, центр = его спавн
world: ""
radius: 20

# Шанс (в %), что после дохода до точки бот постоит 2-6 секунд, а не пойдёт дальше сразу
pause-chance: 25

# Удары по игрокам
attack:
  enabled: true
  # Игрок ближе этого расстояния (в блоках) может привлечь внимание бота
  notice-range: 10
  # Шанс за проверку (раз в 0.5 сек), что бот побежит бить ближайшего игрока (в промилле, 10 = 1%)
  chance-permille: 8
  # Радиус удара
  hit-range: 3.0
  # Урон за удар (2.0 = 1 сердце)
  damage: 1.0
  # Если бот не добежал за это время, он бросает погоню
  chase-seconds: 8
  # Не бить игроков с правом fakeonline.immune и тех, кто в креативе/наблюдателе

# Прибавлять ботов к онлайну в списке серверов (мотд)
count-in-server-list: true
